<script>
  // Prevent flash of wrong theme
  (function() {
    const saved = localStorage.getItem('theme');
    if (saved === 'light') {
      document.documentElement.classList.remove('dark');
    } else if (saved === 'dark' || !saved) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
